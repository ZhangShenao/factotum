[project]
name = "factotum"
version = "0.1.0"
description = "Personal all-round assistant agent built on DeepAgents (LangChain)"
readme = "README.md"
license = "MIT"
authors = [{ name = "ZhangShenao" }]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.8",
    "langchain>=1.3.17",
    "langgraph>=1.2.11",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "apscheduler>=3.10",
]

[project.scripts]
factotum = "assistant.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assistant"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
